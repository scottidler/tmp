name: release

# Tag-driven release. On a v* tag, the shared reusable workflow cross-compiles
# linux amd64/arm64 and macOS x86_64/arm64 (macos-15), tarballs + sha256 each,
# and publishes the GitHub Release.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  cli-release:
    name: CLI Release
    uses: tatari-tv/github-actions-public/.github/workflows/rust-cli-release.yml@v2.0.0
